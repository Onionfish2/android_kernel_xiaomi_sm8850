name: Build Xiaomi SM8850 BakaSU Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_label:
        description: '内核标识 (自定义 uname -r 后缀与 Zip 命名)'
        required: true
        type: string
        default: 'Kokuban-SilverWolf'
      enable_susfs:
        description: '启用 SuSFS 深度隐藏特性'
        required: true
        type: boolean
        default: true
      create_release:
        description: '编译完成后自动创建 GitHub Release'
        required: true
        type: boolean
        default: true

env:
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"

jobs:
  build:
    name: Build Kernel (Android 16 / Linux 6.12)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # 2. 检出源码（锁定 bakasu 分支）
      - name: Checkout Source (bakasu branch)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          submodules: recursive
          fetch-depth: 1

      # 3. 安装基础构建工具链
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves binutils-aarch64-linux-gnu \
            python3 python-is-python3 git curl zip ccache lld llvm

      # 4. 正确配置并装载 BakaSU / KernelSU 驱动（修复路径与 Kconfig 索引）
      - name: Setup BakaSU / KernelSU Source
        run: |
          echo "=== 检查并配置 BakaSU / KernelSU 驱动 ==="
          
          # 清理旧残留文件
          rm -rf drivers/kernelsu KernelSU

          SETUP_OK=false

          # 方案 A：尝试使用官方标准 setup.sh 脚本在线部署
          if curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main; then
            echo "通过 BakaSU setup.sh 部署成功"
            SETUP_OK=true
          elif curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main; then
            echo "通过 ReSukiSU setup.sh 部署成功"
            SETUP_OK=true
          fi

          # 方案 B：备用 Git 克隆 + 软链接映射
          if [ "$SETUP_OK" != "true" ]; then
            echo "setup.sh 下载受阻，回退到手动克隆与软链接映射..."
            git clone --depth=1 https://github.com/Baka-SU/BakaSU.git KernelSU || \
            git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU || \
            git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

            # 关键修复：drivers/kernelsu 必须指向 KernelSU 内的 kernel 子目录
            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi

          # 确保 drivers/Makefile 包含 kernelsu 模块声明
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # 验证软链接与 Kconfig 是否有效存在
          ls -ld drivers/kernelsu
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "::error::未能成功配置 BakaSU 驱动，drivers/kernelsu/Kconfig 缺失！"
            exit 1
          else
            echo "BakaSU 驱动就绪，Kconfig 校验通过！"
          fi

      # 5. 持久化缓存：Google AOSP Clang 工具链
      - name: Cache AOSP Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: aosp-clang-r522817

      - name: Setup AOSP Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/clang
          echo "未命中本地工具链缓存，从 AOSP 下载 clang-r522817..."
          curl -LO "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          tar -C ${{ github.workspace }}/clang/ -zxf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz

      - name: Register Toolchain to PATH
        run: |
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      # 6. 持久化缓存：ccache 编译缓存
      - name: Cache ccache Data
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-ccache-${{ runner.os }}-sm8850-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-sm8850-${{ github.ref_name }}-
            kernel-ccache-${{ runner.os }}-sm8850-

      - name: Setup ccache Config
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache -M 4.5G
          ccache -z
          ccache -s

      # 7. 内核配置、特性启用与标签注入
      - name: Configure Kernel & Apply Features
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          OUT_DIR=out
          mkdir -p ${OUT_DIR}

          # 生成 defconfig
          make -j$(nproc --all) O=${OUT_DIR} \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          # 注入用户自定义的内核标签标识 (uname -r)
          CUSTOM_LABEL="${{ inputs.kernel_label }}"
          echo "设置内核 LocalVersion 为: -${CUSTOM_LABEL}"
          scripts/config --file ${OUT_DIR}/.config --set-str LOCALVERSION "-${CUSTOM_LABEL}"

          # 注入 Hybrid Mount 核心依赖 (OverlayFS, tmpfs_xattr, squashfs)
          scripts/config --file ${OUT_DIR}/.config -e OVERLAY_FS
          scripts/config --file ${OUT_DIR}/.config -e SQUASHFS
          scripts/config --file ${OUT_DIR}/.config -e TMPFS_XATTR

          # 注入 BakaSU 与 SuSFS 深度隐藏特性
          scripts/config --file ${OUT_DIR}/.config -e KSU
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SUS_MOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_ENABLE_HASH_MODE
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_TRY_UMOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SPOOF_UNAME
          fi

          # 规避 pahole 与 BTF 冲突
          scripts/config --file ${OUT_DIR}/.config -d DEBUG_INFO_BTF

      # 8. 执行内核镜像编译
      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          OUT_DIR=out
          make -j$(nproc --all) O=${OUT_DIR} \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          if [ ! -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            echo "::error::编译失败，未在产物目录找到 Image 文件！"
            exit 1
          fi

      # 9. 输出本轮 ccache 统计结果
      - name: Display ccache Statistics
        run: |
          echo "=== ccache 构建统计 ==="
          ccache -s

      # 10. 使用 AnyKernel3 打包刷机包
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git*

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image AnyKernel3/Image

          BUILD_DATE=$(date +%Y%m%d_%H%M%S)
          CUSTOM_LABEL="${{ inputs.kernel_label }}"
          ZIP_NAME="Kernel-SM8850-${CUSTOM_LABEL}-${BUILD_DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      # 11. 上传 Artifact 构建产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      # 12. 自动发布到 GitHub Releases
      - name: Publish Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.kernel_label }}-${{ env.BUILD_DATE }}
          name: Xiaomi SM8850 BakaSU (${{ inputs.kernel_label }}) -${{ env.BUILD_DATE }}
          body: |
            ### 构建信息
            - **源码分支**: `bakasu`
            - **芯片架构**: Qualcomm SM8850 (Xiaomi 17 系列)
            - **内核基线**: Linux 6.12 GKI (Android 16)
            - **集成特性**: BakaSU, SuSFS 模块隐藏, Hybrid Mount
            - **内核标签**: `${{ inputs.kernel_label }}`
          files: ${{ env.ZIP_NAME }}
