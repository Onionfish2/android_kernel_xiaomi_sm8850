name: Build Xiaomi SM8850 BakaSU Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_label:
        description: '内核标识 (自定义 Zip 与产物命名)'
        required: true
        type: string
        default: 'Kokuban-SilverWolf'
      enable_susfs:
        description: '启用 SuSFS 深度隐藏特性'
        required: true
        type: boolean
        default: true
      init_boot_url:
        description: '可选：原厂 init_boot.img 下载直链 (随 Release 一同分发)'
        required: false
        type: string
        default: ''
      create_release:
        description: '编译完成后自动创建 GitHub Release'
        required: true
        type: boolean
        default: true
      force_build:
        description: '忽略更新检查，强制执行构建'
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '0 20 * * *'

env:
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"

jobs:
  check:
    name: Check Upstream Updates & Schedule
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      need_build: ${{ steps.check-update.outputs.need_build }}
      build_reason: ${{ steps.check-update.outputs.build_reason }}
      track_hash: ${{ steps.check-update.outputs.track_hash }}
    steps:
      - name: Checkout Source (bakasu branch)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          fetch-depth: 1

      - name: Check Updates & 7-Day Cycle
        id: check-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 开始巡检上游更新与发布周期 ==="
          NEED_BUILD="false"
          REASON=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEED_BUILD="true"
            REASON="手动控制台触发编译"
          else
            BAKASU_SHA=$(git ls-remote https://github.com/Baka-SU/BakaSU.git refs/heads/main 2>/dev/null | awk '{print $1}' || echo "unknown")
            SUSFS_SHA=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android16-6.12 2>/dev/null | awk '{print $1}')
            [ -z "$SUSFS_SHA" ] && SUSFS_SHA=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/kernel-6.12 2>/dev/null | awk '{print $1}' || echo "unknown")
            KERNEL_SHA=$(git rev-parse HEAD)

            CURRENT_HASH="KSU:${BAKASU_SHA}_SUSFS:${SUSFS_SHA}_KERNEL:${KERNEL_SHA}"
            echo "当前上游组件指纹: ${CURRENT_HASH}"

            LAST_RELEASE_TIME=$(gh release view --json publishedAt -q .publishedAt 2>/dev/null || echo "")
            LAST_RELEASE_BODY=$(gh release view --json body -q .body 2>/dev/null || echo "")

            if [ -z "$LAST_RELEASE_TIME" ]; then
              NEED_BUILD="true"
              REASON="未检测到历史 Release，执行首次全量构建"
            else
              LAST_SEC=$(date -d "$LAST_RELEASE_TIME" +%s 2>/dev/null || echo 0)
              NOW_SEC=$(date +%s)
              DAYS_DIFF=$(( (NOW_SEC - LAST_SEC) / 86400 ))

              echo "距离上一次发布已有: ${DAYS_DIFF} 天"

              if [ "$DAYS_DIFF" -ge 7 ]; then
                NEED_BUILD="true"
                REASON="已达到 7 天定期编译周期 (距上次发布已有 ${DAYS_DIFF} 天)"
              elif ! echo "$LAST_RELEASE_BODY" | grep -Fq "$CURRENT_HASH"; then
                NEED_BUILD="true"
                REASON="检测到上游组件变动 (BakaSU / SuSFS / 内核源码有新提交)"
              else
                echo "上游均无新更新，且发布周期未满 7 天，跳过本次构建。"
              fi
            fi
          fi

          echo "need_build=${NEED_BUILD}" >> $GITHUB_OUTPUT
          echo "build_reason=${REASON}" >> $GITHUB_OUTPUT
          echo "track_hash=${CURRENT_HASH}" >> $GITHUB_OUTPUT

  build:
    name: Build Kernel (Android 16 / Linux 6.12)
    needs: check
    if: needs.check.outputs.need_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # 0. 初始化并校验构建环境变量
      - name: Initialize Workflow Environment
        run: |
          LABEL="${{ inputs.kernel_label }}"
          [ -z "$LABEL" ] && LABEL="Kokuban-SilverWolf"
          echo "KERNEL_LABEL=${LABEL}" >> $GITHUB_ENV

          ENABLE_SUSFS="${{ inputs.enable_susfs }}"
          [ "$ENABLE_SUSFS" != "false" ] && ENABLE_SUSFS="true"
          echo "ENABLE_SUSFS=${ENABLE_SUSFS}" >> $GITHUB_ENV

          CREATE_REL="${{ inputs.create_release }}"
          [ "$CREATE_REL" != "false" ] && CREATE_REL="true"
          echo "CREATE_RELEASE=${CREATE_REL}" >> $GITHUB_ENV

          echo "=== 构建参数初始化完成 ==="
          echo "内核标识: ${LABEL}"
          echo "启用 SuSFS: ${ENABLE_SUSFS}"
          echo "发布 Release: ${CREATE_REL}"

      - name: Display Build Reason
        run: |
          echo "=== 触发本次编译的原因 ==="
          echo "${{ needs.check.outputs.build_reason }}"

      # 1. 清理 Runner 磁盘空间
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      # 2. 检出源码
      - name: Checkout Source (bakasu branch)
        uses: actions/checkout@v4
        with:
          ref: bakasu
          submodules: recursive
          fetch-depth: 1

      # 3. 安装依赖工具链 (包含 Python 与打包组件)
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves binutils-aarch64-linux-gnu \
            python3 python-is-python3 git curl zip ccache lld llvm \
            libdw-dev patch cpio

      # 4. 配置并装载 BakaSU 驱动
      - name: Setup BakaSU / KernelSU Source
        run: |
          echo "=== 检查并配置 BakaSU / KernelSU 驱动 ==="
          rm -rf drivers/kernelsu KernelSU

          SETUP_OK=false
          if curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main; then
            echo "通过 BakaSU setup.sh 部署成功"
            SETUP_OK=true
          elif curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main; then
            echo "通过 ReSukiSU setup.sh 部署成功"
            SETUP_OK=true
          fi

          if [ "$SETUP_OK" != "true" ]; then
            echo "setup.sh 网络受限，切换为手动克隆与软链接映射..."
            git clone --depth=1 https://github.com/Baka-SU/BakaSU.git KernelSU || \
            git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU || \
            git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi

          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "::error::未能成功配置 BakaSU 驱动，drivers/kernelsu/Kconfig 缺失！"
            exit 1
          fi

      # 5. 集成 SuSFS 内核端代码与精准修复补丁
      - name: Setup & Patch SuSFS Kernel Side
        if: env.ENABLE_SUSFS == 'true'
        run: |
          echo "=== 集成 SuSFS 内核端代码与补丁 ==="
          rm -rf susfs4ksu

          git clone --depth=1 -b gki-android16-6.12 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu || \
          git clone --depth=1 -b kernel-6.12 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu || \
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          mkdir -p include/linux fs
          cp -fv susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp -fv susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ || true
          cp -fv susfs4ksu/kernel_patches/fs/susfs.c fs/

          if ! grep -q "CONFIG_KSU_SUSFS" fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          fi

          PATCH_FILE=$(find susfs4ksu/kernel_patches -name "*6.12*.patch" | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
            PATCH_FILE=$(find susfs4ksu/kernel_patches -name "*android16*.patch" | head -n 1)
          fi

          if [ -n "$PATCH_FILE" ]; then
            echo "应用内核补丁: ${PATCH_FILE} ..."
            patch -p1 --forward < "${PATCH_FILE}" || {
              echo "部分 hunk 已打入或偏移，进入后续自动修复阶段..."
            }
          fi

          # 确保 susfs_def.h 引入 cred.h (解决 current_uid 未定义)
          if [ -f "include/linux/susfs_def.h" ]; then
            if ! grep -q "linux/cred.h" include/linux/susfs_def.h; then
              echo "修复 susfs_def.h: 注入 cred.h 依赖..."
              sed -i '1i #include <linux/cred.h>' include/linux/susfs_def.h
            fi
          fi

          # 规范在 fs/exec.c 引入 susfs.h (避免未声明函数报错)
          if [ -f "fs/exec.c" ]; then
            if ! grep -q "<linux/susfs.h>" fs/exec.c; then
              if grep -q "<linux/binfmts.h>" fs/exec.c; then
                sed -i '/#include <linux\/binfmts.h>/a #include <linux/susfs.h>' fs/exec.c
              elif grep -q "<linux/sched.h>" fs/exec.c; then
                sed -i '/#include <linux\/sched.h>/a #include <linux/susfs.h>' fs/exec.c
              else
                sed -i '1i #include <linux/susfs.h>' fs/exec.c
              fi
              echo "已成功向 fs/exec.c 注入 #include <linux/susfs.h>"
            fi
          fi

          # 注入 ksu_handle_setresuid 钩子
          if ! grep -q "ksu_handle_setresuid" kernel/sys.c; then
            echo "向 kernel/sys.c 注入 ksu_handle_setresuid 钩子..."
            sed -i '1i #if defined(CONFIG_KSU) || defined(CONFIG_KSU_SUSFS)\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif' kernel/sys.c
            sed -i '/long __sys_setresuid(uid_t ruid, uid_t euid, uid_t suid)/{n;s/{/{\n#if defined(CONFIG_KSU) || defined(CONFIG_KSU_SUSFS)\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif/}' kernel/sys.c
          fi

      # 6. 解析特性组件版本
      - name: Extract Feature Component Versions
        run: |
          echo "=== 提取特性组件版本 ==="

          BAKASU_VER="未知版本"
          if [ -d "KernelSU/.git" ]; then
            BAKASU_VER=$(cd KernelSU && (git describe --tags --always 2>/dev/null || git rev-parse --short HEAD))
          elif [ -d "drivers/kernelsu/.git" ]; then
            BAKASU_VER=$(cd drivers/kernelsu && (git describe --tags --always 2>/dev/null || git rev-parse --short HEAD))
          fi
          if [ -f "drivers/kernelsu/kernel/Makefile" ]; then
            KSU_NUM=$(grep -E 'KSU_VERSION=' drivers/kernelsu/kernel/Makefile | head -n 1 | sed -E 's/.*KSU_VERSION=([0-9a-zA-Z._-]+).*/\1/' || true)
            [ -n "$KSU_NUM" ] && BAKASU_VER="${BAKASU_VER} (Build:${KSU_NUM})"
          fi

          if [ "$ENABLE_SUSFS" = "true" ]; then
            SUSFS_GIT=""
            [ -d "susfs4ksu/.git" ] && SUSFS_GIT=$(cd susfs4ksu && (git describe --tags --always 2>/dev/null || git rev-parse --short HEAD))
            SUSFS_TAG=$(grep -E 'define[[:space:]]+SUSFS_VERSION' include/linux/susfs.h 2>/dev/null | head -n 1 | awk '{print $3}' | tr -d '"' || true)
            
            if [ -n "$SUSFS_TAG" ]; then
              SUSFS_VER="${SUSFS_TAG} (${SUSFS_GIT:-Git})"
            elif [ -n "$SUSFS_GIT" ]; then
              SUSFS_VER="${SUSFS_GIT}"
            else
              SUSFS_VER="v1.5.x+ (最新提交)"
            fi
          else
            SUSFS_VER="未启用 (Disabled)"
          fi

          HM_LOG=$(git log -1 --grep="Hybrid Mount" --format="%h" 2>/dev/null || true)
          if [ -n "$HM_LOG" ]; then
            HYBRID_MOUNT_VER="内核内置 (${HM_LOG})"
          else
            HYBRID_MOUNT_VER="v1.0 (OverlayFS + VFS Inline)"
          fi

          echo "BAKASU_VER=${BAKASU_VER}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER}" >> $GITHUB_ENV
          echo "HYBRID_MOUNT_VER=${HYBRID_MOUNT_VER}" >> $GITHUB_ENV

      # 7. Clang 工具链离线恢复与即时持久化
      - name: Restore AOSP Clang Cache
        id: cache-clang-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/clang
          key: aosp-clang-r522817

      - name: Setup AOSP Clang Toolchain
        if: steps.cache-clang-restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/clang
          echo "从 AOSP 下载 clang-r522817..."
          curl -LO "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          tar -C ${{ github.workspace }}/clang/ -zxf clang-r522817.tar.gz
          rm -f clang-r522817.tar.gz

      - name: Save AOSP Clang Cache Immediately
        if: steps.cache-clang-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/clang
          key: aosp-clang-r522817

      - name: Register Toolchain to PATH
        run: |
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      # 8. 恢复 ccache 历史编译缓存
      - name: Restore ccache Data
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-ccache-${{ runner.os }}-sm8850-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-sm8850-${{ github.ref_name }}-
            kernel-ccache-${{ runner.os }}-sm8850-

      - name: Setup ccache Config
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache -M 4.5G
          ccache -z

          sudo mkdir -p /usr/local/ccache-bin
          sudo ln -sf $(which ccache) /usr/local/ccache-bin/clang
          sudo ln -sf $(which ccache) /usr/local/ccache-bin/clang++
          echo "/usr/local/ccache-bin" >> $GITHUB_PATH

      # 9. 内核配置与全套特性注入 (注意：保持原生 GKI 默认版本，防止驱动魔数不匹配)
      - name: Configure Kernel & Apply Features
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/local/ccache-bin:${{ github.workspace }}/clang/bin:$PATH"

          OUT_DIR=out
          mkdir -p ${OUT_DIR}

          make -j$(nproc --all) O=${OUT_DIR} \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            gki_defconfig

          # Hybrid Mount 特性项
          scripts/config --file ${OUT_DIR}/.config -e OVERLAY_FS
          scripts/config --file ${OUT_DIR}/.config -e SQUASHFS
          scripts/config --file ${OUT_DIR}/.config -e TMPFS_XATTR

          # BakaSU 基础项
          scripts/config --file ${OUT_DIR}/.config -e KSU

          # 激活完整 SuSFS 特性宏链
          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "正在激活 SuSFS 全套功能宏..."
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SUS_MOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SUS_SU
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SUS_KSTAT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SUS_OVERLAYFS
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_TRY_UMOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_ENABLE_HASH_MODE
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SPOOF_UNAME
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            scripts/config --file ${OUT_DIR}/.config -e KSU_SUSFS_OPEN_REDIRECT
          fi

          scripts/config --file ${OUT_DIR}/.config -d DEBUG_INFO_BTF

      # 10. 执行内核镜像编译
      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="/usr/local/ccache-bin:${{ github.workspace }}/clang/bin:$PATH"

          OUT_DIR=out

          make -j$(nproc --all) O=${OUT_DIR} \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-w" \
            Image 2>&1 | tee build.log

          if [ ! -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            echo "================== 编译失败，核心错误提取 =================="
            grep -iE "(fatal error|error:)" build.log -B 2 -A 5 | tail -n 40 || true
            echo "==========================================================="
            exit 1
          fi

      # 11. 即使失败也强制保存本次 ccache 缓存
      - name: Save ccache Data Even on Failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-ccache-${{ runner.os }}-sm8850-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 12. 输出 ccache 统计
      - name: Display ccache Statistics
        run: |
          echo "=== ccache 构建统计 ==="
          ccache -s

      # 13. 使用 AnyKernel3 针对小米 17 系列定制打包
      - name: Package with AnyKernel3
        run: |
          echo "=== 准备 AnyKernel3 刷机包环境 ==="
          rm -rf AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git*

          # 写入新编译出的内核镜像
          cp -fv out/arch/arm64/boot/Image AnyKernel3/Image

          # 配置 anykernel.sh 设备代号与属性
          sed -i "s/kernel.string=.*/kernel.string=Xiaomi17-Kokuban-${KERNEL_LABEL}/g" AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.systemless=1/do.systemless=0/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=nezha/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=popsicle/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=pandora/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=pudding/g' AnyKernel3/anykernel.sh

          # 配置 A/B 槽位与分区
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' AnyKernel3/anykernel.sh
          sed -i 's/RAMDISK_COMPRESSION=auto;/RAMDISK_COMPRESSION=auto;\nPATCH_VBMETA_FLAG=auto;/g' AnyKernel3/anykernel.sh

          # GKI 架构必须跳过 ramdisk 解包
          sed -i 's/dump_boot;/split_boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/write_boot;/flash_boot;/g' AnyKernel3/anykernel.sh

          BUILD_DATE=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="Kernel-SM8850-${KERNEL_LABEL}-${BUILD_DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          
      # 14. 编译独立 boot.img 并处理 init_boot.img
      - name: Build boot.img & Prepare init_boot.img
        run: |
          echo "=== 正在打包独立 GKI boot.img 与处理 init_boot.img ==="
          mkdir -p release_files

          # 1. 获取 Google AOSP 官方 mkbootimg 打包脚本
          curl -sLo mkbootimg.py https://raw.githubusercontent.com/aosp-mirror/platform_system_tools_mkbootimg/master/mkbootimg.py

          # 2. 构建符合 Boot Header v4 规范的标准 GKI boot.img
          BOOT_IMG_NAME="boot-SM8850-${KERNEL_LABEL}-${BUILD_DATE}.img"
          python3 mkbootimg.py \
            --header_version 4 \
            --kernel out/arch/arm64/boot/Image \
            --pagesize 4096 \
            --output "release_files/${BOOT_IMG_NAME}"
          echo "已成功生成独立 boot 启动镜像: ${BOOT_IMG_NAME}"

          # 3. 处理 init_boot.img (若输入了原厂下载直链，则自动拉取打包)
          INIT_BOOT_URL="${{ inputs.init_boot_url }}"
          if [ -n "$INIT_BOOT_URL" ]; then
            INIT_BOOT_IMG_NAME="init_boot-SM8850-${BUILD_DATE}.img"
            echo "正在从直链下载指定原厂 init_boot: ${INIT_BOOT_URL} ..."
            curl -sLo "release_files/${INIT_BOOT_IMG_NAME}" "$INIT_BOOT_URL"
            echo "已成功附加 init_boot 产物: ${INIT_BOOT_IMG_NAME}"
          else
            echo "提示：未传入 init_boot_url 直链。在 GKI 架构下，init_boot 仅存放系统原厂 ramdisk，不含内核，无需重复打包。"
          fi

          # 4. 汇总 AnyKernel3 Zip 刷机包到发布目录
          cp -fv "${ZIP_NAME}" release_files/

      # 15. 上传 Artifact 构建产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8850-${{ env.KERNEL_LABEL }}-${{ env.BUILD_DATE }}
          path: release_files/*

      # 16. 自动发布到 GitHub Releases
      - name: Publish Release
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KERNEL_LABEL }}-${{ env.BUILD_DATE }}
          name: Xiaomi SM8850 BakaSU (${{ env.KERNEL_LABEL }}) -${{ env.BUILD_DATE }}
          body: |
            ### 📱 构建基本信息
            - **目标芯片**: 高通骁龙 SM8850 (小米 17 系列)
            - **内核基线**: Linux 6.12 GKI (Android 16)
            - **触发来源**: `${{ needs.check.outputs.build_reason }}`
            - **自定义内核标识**: `${{ env.KERNEL_LABEL }}`
            - **构建时间**: `${{ env.BUILD_DATE }}`

            ### 🧩 核心特性集成版本
            - **BakaSU 内核补丁版本**: `${{ env.BAKASU_VER }}`
            - **SuSFS 隐藏增强版本**: `${{ env.SUSFS_VER }}`
            - **Hybrid Mount 版本**: `${{ env.HYBRID_MOUNT_VER }}`

            ### 📦 包含产物与刷入指引
            1. **AnyKernel3 刷机包 (`Kernel-SM8850-*.zip`)**:
               - 适配小米 17 系列动态分区与槽位引导[cite: 1]。
               - 可在支持 Android 16 的 Recovery (TWRP / OrangeFox) 中直接刷入。
            2. **独立启动镜像 (`boot-SM8850-*.img`)**:
               - 标准 GKI Boot Header v4 格式，内嵌新编译出的 Linux 6.12 内核。
               - 支持在 Fastboot 模式直接单刷：
                 ```bash
                 fastboot flash boot boot-SM8850-*.img
                 ```
            3. **初始化引导镜像 (`init_boot-SM8850-*.img`)**:
               - 若手动触发构建时填入了原厂 `init_boot_url`，则会自动附带此包，方便备用与还原。

            <!-- TRACK_HASH: ${{ needs.check.outputs.track_hash }} -->
          files: release_files/*
